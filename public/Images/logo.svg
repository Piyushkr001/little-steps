<svg xmlns="http://www.w3.org/2000/svg"
     width="760" height="180"
     viewBox="0 0 760 180"
     role="img"
     aria-labelledby="logoTitle logoDesc">

  <title id="logoTitle">Little Steps Combined Logo</title>
  <desc id="logoDesc">Combined icon and wordmark logo for Little Steps childcare platform</desc>

  <!-- Icon background -->
  <rect x="20" y="20"
        width="140" height="140"
        rx="34"
        fill="#EAF8F5"/>

  <!-- Left footprint -->
  <path
    d="M68 122c-10-2-15-12-11-24
       2-9 7-18 15-21
       9-4 17 5 17 17
       1 12-7 31-21 28Z"
    fill="#087F78"/>

  <circle cx="54" cy="79" r="8" fill="#087F78"/>
  <circle cx="64" cy="67" r="7" fill="#087F78"/>
  <circle cx="78" cy="62" r="6" fill="#087F78"/>
  <circle cx="90" cy="66" r="5" fill="#087F78"/>

  <!-- Right footprint -->
  <path
    d="M112 103c-11 3-19-5-18-16
       0-11 8-26 17-31
       10-4 18 4 18 16
       0 13-7 29-17 31Z"
    fill="#F2A65A"/>

  <circle cx="96" cy="52" r="5.5" fill="#F2A65A"/>
  <circle cx="107" cy="41" r="6.5" fill="#F2A65A"/>
  <circle cx="120" cy="39" r="6" fill="#F2A65A"/>
  <circle cx="132" cy="47" r="5" fill="#F2A65A"/>

  <!-- Wordmark -->
  <text x="190" y="88"
        font-family="Nunito, 'Arial Rounded MT Bold', Arial, sans-serif"
        font-size="64"
        font-weight="800"
        letter-spacing="-2.5">

    <tspan fill="#087F78">Little</tspan>
    <tspan dx="14" fill="#F2A65A">Steps</tspan>
  </text>

  <!-- Tagline -->
  <text x="194" y="122"
        font-family="Nunito, Arial, sans-serif"
        font-size="17"
        font-weight="700"
        letter-spacing="2.2"
        fill="#52736E">
    TRUSTED 24×7 CHILDCARE PLATFORM
  </text>

</svg>